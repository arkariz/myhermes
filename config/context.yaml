# Context assembly policy.

token_estimation:
  encoder: o200k_base          # tiktoken; approximation across providers
  chars_per_token_fallback: 3.6

# Selection priority (brief 17.2). LOWER number = kept first under budget pressure.
priority:
  current_human_request: 1
  current_task: 2
  acceptance_criteria: 2
  relevant_decisions: 3
  artifact_sections: 4
  source_files: 5
  recent_summary: 6
  recent_turns: 7
  project_context: 8
  repository_broad: 9

# Placement volatility. LOWER = more stable = rendered earlier, so the
# provider's prefix cache can hit. This is a DIFFERENT axis from priority:
# priority decides what gets in, volatility decides where it sits.
volatility:
  role_soul: 0
  project_identity: 0
  conventions: 0
  workflow_state: 1
  relevant_decisions: 2
  artifact_sections: 3
  codebase_map: 3
  source_files: 4
  recent_summary: 5
  recent_turns: 6
  current_human_request: 7

recent_turns:
  count: 3

summarization:
  # Incremental: summarize(previous_summary + new_turn), never the whole history.
  trigger_every_turns: 1
  must_preserve:
    - decisions
    - unresolved questions
    - constraints
    - rejected alternatives
    - current artifact status
    - next actions

redaction:
  # Never allowed into a context package or the agent-state tree.
  deny_patterns:
    - "*.env"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.keystore"
    - "**/credentials*"
    - "**/secrets*"
    - "id_rsa*"
