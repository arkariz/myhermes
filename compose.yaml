# The real orchestrator/agent-runtime container split -- the topology
# docs/plan.md describes, now that both sides of the HTTP boundary exist
# (entrypoints/http/server.py, ports/agent_runtime.py's HttpAgentRuntime).
#
# Deliberately smaller than the plan's original diagram, matching what's
# actually built and verified rather than what was sketched:
#
#   * No shared Hermes-profile volume. The plan's diagram names
#     "hermes-profiles:/root/.hermes" -- a single volume shared by every
#     request. That's exactly the isolation boundary an early spike found
#     broken (two projects sharing one HERMES_HOME both recalled the same
#     planted secret) and fixed by making HERMES_HOME per-project. Mounting
#     a shared profile volume here would reintroduce that bug. agent-runtime
#     needs no Hermes-related volume at all: every request carries its own
#     `home_dir`, which lives under the /workspace/agent-state bind mount
#     both containers already share.
#   * No gateway (LiteLLM/KeiRouter) service. Never implemented --
#     adapters/hermes/invocation.py passes --provider/--model straight
#     through to the hermes CLI, which talks to the provider directly.
#     Adding a gateway service here would describe a capability that
#     doesn't exist yet.
#
# Both services mount the SAME workspace directory at /workspace --
# config/, agent-state/, and projects/ finally sit as siblings inside the
# container the way settings.py already models them, instead of the three
# separate bind mounts (./config, agent-state, projects) this replaced.
# `${AGENTIC_WORKSPACE:-../agentic-workspace}` here is Compose's own
# variable substitution against the HOST's environment/`.env` -- unrelated
# to the AGENTIC_WORKSPACE=/workspace baked into each Dockerfile, which is
# what the CODE inside each container reads. Read-write on both sides: the
# context builder only *reads* project source, but the builder role's own
# file/terminal tools need to write it, and both roles run inside the same
# agent-runtime process via Hermes, not two different containers with
# different access levels.

services:
  agent-runtime:
    build:
      context: .
      dockerfile: deploy/agent-runtime/Dockerfile
    environment:
      # The real `hermes` subprocess launches IN THIS container (POST
      # /run), not in orchestrator -- adapters/hermes/invocation.py::
      # build_env() inherits its own process's os.environ, which is
      # agent-runtime's, not orchestrator's. Without this, every turn
      # fails with Hermes's
      # own "No LLM provider configured" (a clean failure, not a crash,
      # so it looked identical to the deliberate no-key verification runs
      # done earlier -- only caught once a real key was actually set and
      # a turn still failed the same way).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ${AGENTIC_WORKSPACE:-../agentic-workspace}:/workspace
    expose:
      - "8000"
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: deploy/orchestrator/Dockerfile
    depends_on:
      - agent-runtime
    # Forwards every KEY=VALUE line in .env verbatim -- TELEGRAM_BOT_TOKEN,
    # TELEGRAM_FORUM_CHAT_ID, OPENROUTER_API_KEY, and any *_MODEL override
    # a user has set to steer config/models.yaml's own ${VAR:-default}
    # placeholders (resolved by domain/roles.py::resolve_env_placeholders
    # reading THIS container's environment). Deliberately on orchestrator
    # ONLY: putting it on agent-runtime too would leak TELEGRAM_BOT_TOKEN
    # into a container that has no business holding it -- see that
    # service's narrow, explicit OPENROUTER_API_KEY above instead.
    env_file:
      - .env
    environment:
      # A container-topology fact, not a user setting -- doesn't belong in
      # .env. Every Hermes invocation crosses this URL instead of running
      # in-process (see ports/agent_runtime.py's HttpAgentRuntime).
      AGENTIC_RUNTIME_URL: http://agent-runtime:8000
    volumes:
      - ${AGENTIC_WORKSPACE:-../agentic-workspace}:/workspace
    restart: unless-stopped

# One-off CLI commands don't need the bot running:
#   docker compose run --rm orchestrator agentic status toy
