# The real orchestrator/agent-runtime container split -- the topology
# docs/plan.md describes, now that both sides of the HTTP boundary exist
# (runtime/server.py, orchestrator/jobs.py's runtime_url).
#
# Deliberately smaller than the plan's original diagram, matching what's
# actually built and verified rather than what was sketched:
#
#   * No shared Hermes-profile volume. The plan's diagram names
#     "hermes-profiles:/root/.hermes" -- a single volume shared by every
#     request. That's exactly the isolation boundary the Phase 1 spike
#     found broken (two projects sharing one HERMES_HOME both recalled the
#     same planted secret) and fixed by making HERMES_HOME per-project.
#     Mounting a shared profile volume here would reintroduce that bug.
#     agent-runtime needs no Hermes-related volume at all: every request
#     carries its own `home_dir`, which lives under the agent-state volume
#     both containers already mount.
#   * No gateway (LiteLLM/KeiRouter) service. Never implemented --
#     runtime/hermes.py passes --provider/--model straight through to the
#     hermes CLI, which talks to the provider directly. Adding a gateway
#     service here would describe a capability that doesn't exist yet.
#
# Both services now mount a shared project-source volume at
# /workspace/projects -- the path TELEGRAM_DEFAULT_HOST_ROOT and
# orchestrator/cli.py's `--host-path` convention already assumed before
# this volume actually existed. Without it: orchestrator's TurnRunner has
# nowhere real inside its own container to point `project_source_root` at
# (Phase 4/5's indexer/git-diff/DiffProvider all silently degrade to "no
# project source" rather than error, so this gap was invisible until
# someone actually tried a containerized run), and Hermes itself --
# running inside agent-runtime with `toolsets: terminal` -- would have no
# project files to read or write even if the orchestrator side worked.
# Read-write on both sides: the context builder only *reads* source, but
# the builder role's own file/terminal tools need to write it, and both
# roles run inside the same agent-runtime process via Hermes, not two
# different containers with different access levels.

services:
  agent-runtime:
    build:
      context: .
      dockerfile: docker/agent-runtime/Dockerfile
    environment:
      # The real `hermes` subprocess launches IN THIS container (POST
      # /run), not in orchestrator -- runtime/hermes.py::build_env()
      # inherits its own process's os.environ, which is agent-runtime's,
      # not orchestrator's. Without this, every turn fails with Hermes's
      # own "No LLM provider configured" (a clean failure, not a crash,
      # so it looked identical to the deliberate no-key verification runs
      # done earlier -- only caught once a real key was actually set and
      # a turn still failed the same way).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ${AGENT_STATE_DIR:-./data/agent-state}:/workspace/agent-state
      - ${PROJECTS_DIR:-./data/projects}:/workspace/projects
    expose:
      - "8000"
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    depends_on:
      - agent-runtime
    environment:
      AGENTIC_RUNTIME_URL: http://agent-runtime:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_FORUM_CHAT_ID: ${TELEGRAM_FORUM_CHAT_ID:-}
      TELEGRAM_DEFAULT_HOST_ROOT: ${TELEGRAM_DEFAULT_HOST_ROOT:-/workspace/projects}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # config/models.yaml's own ${VAR:-default} placeholders are resolved
      # by orchestrator/config.py reading THIS container's environment --
      # docker compose does NOT auto-forward every .env variable into a
      # service, only ones named here. Without these seven lines, a model
      # override in .env silently has no effect under Compose (it still
      # works in host/CLI mode, since there the shell's own env IS what
      # config.py reads) -- found live while walking through exactly this
      # "switch to a free model" scenario.
      #
      # The defaults duplicate config/models.yaml's own -- NOT `${VAR:-}`.
      # Compose's own substitution runs against the HOST's environment at
      # `up`/`run` time; if PLANNER_MODEL is unset there, `${VAR:-}`
      # resolves to an empty STRING, which still gets forwarded as
      # `PLANNER_MODEL=` (present, just empty). config.py's own
      # `os.environ.get(var, default)` then returns that empty string
      # instead of falling back, because the key exists at all -- silently
      # breaking every role's default model for anyone who doesn't
      # override it. Confirmed live before shipping this. Two sources of
      # truth for the same default is the tradeoff for not introducing a
      # templating dependency just to say "forward this only if set."
      PLANNER_MODEL: ${PLANNER_MODEL:-anthropic/claude-sonnet-4.6}
      DESIGNER_MODEL: ${DESIGNER_MODEL:-anthropic/claude-sonnet-4.6}
      ARCHITECT_MODEL: ${ARCHITECT_MODEL:-anthropic/claude-sonnet-4.6}
      BUILDER_MODEL: ${BUILDER_MODEL:-deepseek/deepseek-v3}
      REVIEWER_MODEL: ${REVIEWER_MODEL:-deepseek/deepseek-v3}
      QA_MODEL: ${QA_MODEL:-deepseek/deepseek-v3}
      SUMMARIZER_MODEL: ${SUMMARIZER_MODEL:-deepseek/deepseek-v3}
    volumes:
      - ./config:/app/config
      - ${AGENT_STATE_DIR:-./data/agent-state}:/workspace/agent-state
      - ${PROJECTS_DIR:-./data/projects}:/workspace/projects
    restart: unless-stopped

# One-off CLI commands don't need the bot running:
#   docker compose run --rm orchestrator python -m orchestrator.cli status toy
