# Role -> model routing. Workflow code names a ROLE, never a provider.
#
# `${VAR:-default}` is this file's own placeholder syntax (resolved by
# domain/roles.py::resolve_env_placeholders against the process
# environment, NOT by YAML) -- set the env var in .env to override a
# role's model without editing this file. Commented-out examples of every
# var live in .env.example.

routing:
  planner:
    provider: openrouter
    model: ${PLANNER_MODEL:-anthropic/claude-sonnet-4.6}
  product-designer:
    provider: openrouter
    model: ${DESIGNER_MODEL:-anthropic/claude-sonnet-4.6}
  architect:
    provider: openrouter
    model: ${ARCHITECT_MODEL:-anthropic/claude-sonnet-4.6}
  builder:
    provider: openrouter
    model: ${BUILDER_MODEL:-deepseek/deepseek-v3}
  reviewer:
    provider: openrouter
    model: ${REVIEWER_MODEL:-deepseek/deepseek-v3}
  qa:
    provider: openrouter
    model: ${QA_MODEL:-deepseek/deepseek-v3}
  summarizer:
    provider: openrouter
    model: ${SUMMARIZER_MODEL:-deepseek/deepseek-v3}
