# Workflow state machine. Transitions are DATA, validated at load.
# An LLM can never choose the next state -- only the engine and typed human
# approval events move a project forward.
#
# kind:
#   autonomous    - agent runs to completion, then advances. Always a boundary turn.
#   collaborative - agent <-> human, indefinitely. An invocation ending is NOT
#                   completion; only an explicit approval finishes the state.
#   gate          - no agent runs. Only a typed approval event advances.

initial: backlog

states:
  # Two ways in: `/approve START_PROJECT` for a brand-new project (the
  # normal path, below), or `/approve IMPORT_PROJECT` for a project that
  # already exists -- human-made, AI-assisted, documented or not --
  # routing to `onboarding` instead. Still exactly one typed human
  # decision either way; see next_by_approval below and onboarding's own.
  backlog:
    kind: gate
    next_by_approval:
      START_PROJECT: discovery
      IMPORT_PROJECT: onboarding

  # An existing codebase, audited rather than assumed. The auditor role
  # explores with its own tools (guided context_mode) and recommends ONE
  # of several possible resume points as a `decision` block -- never
  # decides it outright, same as every other state: a human still has to
  # type the matching /approve.
  onboarding:
    kind: collaborative
    role: auditor
    artifact: onboarding-report.md
    completion: approval
    next_by_approval:
      TO_DISCOVERY: discovery
      TO_PLANNING: planning
      TO_PRODUCT_DESIGN: product-design
      TO_ARCHITECTURE: architecture
      TO_AWAITING_APPROVAL: awaiting-approval
      TO_IMPLEMENTATION: implementation
      TO_REVIEW: review
      TO_QA: qa

  discovery:
    kind: collaborative
    role: planner
    artifact: discovery.md
    completion: approval
    approval_type: APPROVE_DISCOVERY
    next: planning

  planning:
    kind: collaborative
    role: planner
    artifact: prd.md
    completion: approval
    approval_type: APPROVE_PRD
    next: product-design

  product-design:
    kind: collaborative
    role: product-designer
    artifact: product-design.md
    completion: approval
    approval_type: APPROVE_PRODUCT_DESIGN
    next: architecture

  architecture:
    kind: collaborative
    role: architect
    artifact: architecture.md
    completion: approval
    approval_type: APPROVE_ARCHITECTURE
    next: awaiting-approval

  awaiting-approval:
    kind: gate
    approval_type: APPROVE_TECH_PLAN
    next: implementation

  implementation:
    kind: autonomous
    role: builder
    max_attempts: 2
    on_failure: blocked
    next: review

  review:
    kind: autonomous
    role: reviewer
    max_attempts: 2
    on_failure: blocked
    next: qa

  qa:
    kind: autonomous
    role: qa
    max_attempts: 2
    on_failure: blocked
    next: awaiting-merge
    # QA failure sends work back rather than blocking outright (Pang's pattern).
    on_reject: implementation

  awaiting-merge:
    kind: gate
    approval_type: APPROVE_MERGE
    next: done

  done:
    kind: terminal

  blocked:
    kind: terminal
    recoverable: true

  cancelled:
    kind: terminal

  failed:
    kind: terminal
    recoverable: true
